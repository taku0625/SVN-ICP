---
/svnicp/SVNICP:
   ros__parameters:
      estimator: "ICP"
      class_type: "SVNICP"
      dataset_duration: 47700038212.
      auto_shutdown_progress: 99.0
      buffer_capacity: 100
      cloud_history_capacity: 1
      save_tum_trajectory: true
      tum_trajectory_path: "/output/niwa2_svnicp.tum"
      SVNICP_parameters:
           optimizer : "Adam"   # only used for original Stein ICP
           iterations: 30
           batch_size: 200
           particle_size: 30
           normalize: false
           lr: 0.03
           max_dist: 1.0
           frame_gap_seconds: 0.05
           using_EarlyStop: true
           convergence_steps: 3
           convergence_threshold: 0.0001

           deskew_cloud: true

           max_range: 100.0
           min_range: 2.0       # 0.3 for New college cloister, 5.0 for others
           voxel_size: 2.0
           map_voxel_max_points: 20
           map_voxel_size: 2.0

           USE_Segmentation: false

           use_weight_mean: false

           save_particles: false
           pub_cloud: false

      lidar_param:
           topic: "/livox/lidar_192_168_1_182"

      imu_param:
           topic: "/livox/imu_192_168_1_182"
           rot_rw: [ 100., 100., 100. ]
           vel_rw: [ 1000., 1000., 1000. ]
           gbstd: [ 200., 200., 200. ]
           abstd: [ 5000., 5000., 5000. ]

      lio_param:
           icp_cov_scales: [ 1., 1., 1., 1., 1., 1. ]
           const_LidarCov: [ 1e-4, 1e-5 ]
           use_constCov: true
           initposstd: [ 0.05, 0.05, 0.05 ]
           initvelstd: [ 1.0, 1.0, 1.0 ]
           initattstd: [ 5.0, 5.0, 5.0 ]
           extrinsic_t: [ 0., 0., 0. ]
           extrinsic_R: [ 1., 0., 0.,
                          0., 1., 0.,
                          0., 0., 1. ]
