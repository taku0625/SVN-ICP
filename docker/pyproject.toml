[project]
name = "svnicp-container-tools"
version = "0.1.0"
description = "Convert the SVN-ICP Dockerfile with spython"
requires-python = ">=3.10"
dependencies = ["spython==0.3.14"]

[dependency-groups]
test = ["numpy>=1.24,<3", "PyYAML>=6,<7"]
evaluation = ["numpy==1.26.4", "PyYAML>=6,<7"]

[tool.uv]
package = false
conflicts = [[{ group = "evaluation" }, { group = "test" }]]

[tool.uv.dependency-groups]
evaluation = { requires-python = ">=3.10,<3.13" }
